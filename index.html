<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Weather — a little forecast</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --surface: #fff;
      --surface-soft: #f1f5fb;
      --ink: #17243a;
      --muted: #748198;
      --line: #e8edf4;
      --accent: #ef9d5b;
      --accent-wash: #fff1e3;
      --blue: #6a9dd8;
      --shadow: 0 22px 60px rgba(38, 57, 84, .09);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --surface: #1a2331;
        --surface-soft: #202c3c;
        --ink: #edf3fa;
        --muted: #9aa9bd;
        --line: #2b3849;
        --accent: #ffb778;
        --accent-wash: #3c3029;
        --blue: #8db8e8;
        --shadow: 0 22px 60px rgba(0, 0, 0, .24);
      }
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent-wash) 70%, transparent), transparent 52%),
        var(--bg);
    }
    button, input { font: inherit; }
    .app { width: min(100%, 620px); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.03em; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      color: #fff; background: var(--accent); border-radius: 12px;
      box-shadow: 0 5px 15px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .live { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #63bd8a; }
    .panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }
    .hero { padding: 28px 32px 24px; }
    .search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(100%, 310px);
      min-height: 44px;
      padding: 0 14px;
      color: var(--muted);
      background: var(--surface-soft);
      border: 1px solid transparent;
      border-radius: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
    .search svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .search input { width: 100%; min-width: 0; padding: 10px 0; color: var(--ink); background: transparent; border: 0; outline: 0; }
    .search input::placeholder { color: var(--muted); }
    .search button {
      display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 auto;
      color: var(--muted); background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    }
    .search button:hover { color: var(--ink); background: color-mix(in srgb, var(--line) 70%, transparent); }
    .place-line { margin-top: 28px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .place-line svg { width: 16px; height: 16px; color: var(--accent); }
    h1 { margin: 5px 0 0; font-size: clamp(28px, 7vw, 36px); line-height: 1.13; letter-spacing: -.055em; }
    .current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 200px;
      padding: 6px 7px 4px 0;
    }
    .temperature { display: flex; align-items: flex-start; margin-top: 6px; font-size: clamp(76px, 18vw, 112px); font-weight: 650; line-height: .95; letter-spacing: -.09em; }
    .temperature sup { margin: 12px 0 0 6px; font-size: .28em; font-weight: 500; letter-spacing: -.02em; }
    .condition { margin-top: 14px; color: var(--muted); font-size: 15px; }
    .weather-art { width: 150px; height: 145px; flex: 0 0 auto; color: var(--accent); }
    .weather-art svg { width: 100%; height: 100%; overflow: visible; }
    .details {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-top: 12px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .detail { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .detail-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; color: var(--blue); background: var(--surface-soft); border-radius: 12px; }
    .detail-icon svg { width: 18px; height: 18px; }
    .detail-label { color: var(--muted); font-size: 12px; }
    .detail-value { margin-top: 2px; font-size: 14px; font-weight: 650; white-space: nowrap; }
    .forecast-section { padding: 22px 32px 28px; background: color-mix(in srgb, var(--surface-soft) 45%, var(--surface)); border-top: 1px solid var(--line); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .section-head span { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .day-card {
      min-width: 0; padding: 13px 5px 12px; text-align: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    }
    .day-name { overflow: hidden; color: var(--muted); font-size: 12px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
    .day-icon { width: 31px; height: 31px; margin: 9px auto 8px; color: var(--accent); }
    .day-icon svg { width: 100%; height: 100%; }
    .temps { display: flex; justify-content: center; gap: 5px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .temps .low { color: var(--muted); font-weight: 500; }
    .status { min-height: 20px; margin: 15px 2px 0; color: var(--muted); font-size: 12px; text-align: center; }
    .status.error { color: #cc7747; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 520px) {
      body { padding: 27px 14px; place-items: start center; }
      .hero { padding: 22px 20px 20px; }
      .forecast-section { padding: 20px 16px 22px; }
      .current { min-height: 168px; }
      .weather-art { width: 120px; height: 120px; margin-right: -4px; }
      .details { gap: 6px; }
      .detail { gap: 6px; }
      .detail-icon { width: 31px; height: 31px; border-radius: 10px; }
      .detail-label { font-size: 11px; }
      .detail-value { font-size: 13px; }
      .forecast { gap: 5px; }
      .day-card { padding-inline: 2px; border-radius: 13px; }
      .day-name { font-size: 11px; }
      .temps { gap: 3px; font-size: 11px; }
    }
    @media (max-width: 360px) {
      .forecast { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .forecast .day-card:nth-child(n + 5) { display: none; }
      .weather-art { width: 100px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></span>
        <span>little weather</span>
      </div>
      <div class="live" id="live-label">Live forecast</div>
    </header>
    <section class="panel" aria-label="Weather forecast">
      <div class="hero">
        <form class="search" id="search-form" role="search">
          <label class="visually-hidden" for="city-search">Search for a city</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>
          <input id="city-search" type="search" placeholder="Search a city…" autocomplete="off" spellcheck="false">
          <button id="clear-search" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </form>
        <div class="place-line">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="location">Tokyo, Japan</span>
        </div>
        <h1 id="headline">Good afternoon</h1>
        <div class="current">
          <div>
            <div class="temperature"><span id="temperature">21</span><sup>°</sup></div>
            <div class="condition" id="condition">Partly cloudy</div>
          </div>
          <div class="weather-art" id="current-icon" aria-hidden="true"></div>
        </div>
        <div class="details">
          <div class="detail">
            <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M4 16h8a3 3 0 1 1-3 3"/></svg></span>
            <div><div class="detail-label">Wind</div><div class="detail-value" id="wind">12 km/h</div></div>
          </div>
          <div class="detail">
            <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s-6.5 7.3-6.5 12a6.5 6.5 0 0 0 13 0C18.5 10.3 12 3 12 3Z"/><path d="M9 16a3 3 0 0 0 3 3"/></svg></span>
            <div><div class="detail-label">Humidity</div><div class="detail-value" id="humidity">64%</div></div>
          </div>
          <div class="detail">
            <span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2"/></svg></span>
            <div><div class="detail-label">Feels like</div><div class="detail-value" id="feels-like">23°</div></div>
          </div>
        </div>
      </div>
      <div class="forecast-section">
        <div class="section-head"><h2>7-day forecast</h2><span id="unit-label">°C · Daily</span></div>
        <div class="forecast" id="forecast" aria-label="Seven day forecast"></div>
        <p class="status" id="status" aria-live="polite">Getting the latest forecast…</p>
      </div>
    </section>
  </main>
  <script>
    const fallback = {
      current: { temperature_2m: 21, apparent_temperature: 23, relative_humidity_2m: 64, wind_speed_10m: 12, weather_code: 2 },
      daily: {
        time: ["2026-10-08", "2026-10-09", "2026-10-10", "2026-10-11", "2026-10-12", "2026-10-13", "2026-10-14"],
        weather_code: [2, 1, 3, 61, 2, 0, 3],
        temperature_2m_max: [23, 24, 21, 19, 22, 25, 20],
        temperature_2m_min: [17, 18, 16, 15, 16, 18, 15]
      }
    };
    const places = {
      "tokyo": { name: "Tokyo", country: "Japan", latitude: 35.6762, longitude: 139.6503, timezone: "Asia/Tokyo" },
      "new york": { name: "New York", country: "United States", latitude: 40.7128, longitude: -74.006, timezone: "America/New_York" },
      "london": { name: "London", country: "United Kingdom", latitude: 51.5072, longitude: -.1276, timezone: "Europe/London" },
      "paris": { name: "Paris", country: "France", latitude: 48.8566, longitude: 2.3522, timezone: "Europe/Paris" },
      "sydney": { name: "Sydney", country: "Australia", latitude: -33.8688, longitude: 151.2093, timezone: "Australia/Sydney" },
      "singapore": { name: "Singapore", country: "Singapore", latitude: 1.3521, longitude: 103.8198, timezone: "Asia/Singapore" },
      "seoul": { name: "Seoul", country: "South Korea", latitude: 37.5665, longitude: 126.978, timezone: "Asia/Seoul" },
      "san francisco": { name: "San Francisco", country: "United States", latitude: 37.7749, longitude: -122.4194, timezone: "America/Los_Angeles" }
    };
    const weatherNames = {
      0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Foggy", 48: "Foggy", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
      56: "Freezing drizzle", 57: "Freezing drizzle", 61: "Light rain", 63: "Rain",
      65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow",
      73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Rain showers",
      81: "Rain showers", 82: "Heavy showers", 85: "Snow showers", 86: "Heavy snow showers",
      95: "Thunderstorm", 96: "Thunder & hail", 99: "Thunder & hail"
    };
    const $ = (id) => document.getElementById(id);
    const sun = '<circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></g>';
    const cloud = '<path d="M6.4 18h10.2a4.1 4.1 0 0 0 .2-8.2 6 6 0 0 0-11.5 1.3A3.5 3.5 0 0 0 6.4 18Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>';
    function icon(code, large) {
      let inner;
      if (code === 0 || code === 1) inner = sun;
      else if (code === 2) inner = '<g transform="translate(1 -1) scale(.82)">' + sun + '</g>' + '<path d="M7 19h10a4 4 0 0 0 .2-8 5.7 5.7 0 0 0-10.8 1.2A3.4 3.4 0 0 0 7 19Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>';
      else if (code === 3 || code === 45 || code === 48) inner = cloud;
      else if ([71, 73, 75, 77, 85, 86].includes(code)) inner = cloud + '<g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m8 19-1 2m5-2-1 2m5-2-1 2"/></g>';
      else if (code >= 95) inner = cloud + '<path d="m13 16-3 4h3l-1 3 4-5h-3l1-2Z" fill="currentColor"/>';
      else inner = cloud + '<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m8 19-1 3m6-3-1 3m6-3-1 3"/></g>';
      return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"' + (large ? ' class="large-weather-icon"' : '') + '>' + inner + '</svg>';
    }
    function condition(code) { return weatherNames[code] || "Variable conditions"; }
    function dayName(date, index) {
      if (index === 0) return "Today";
      return new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(new Date(date + "T12:00:00Z"));
    }
    function render(data, place, units = "celsius") {
      const current = data.current;
      const daily = data.daily;
      const fahrenheit = units === "fahrenheit";
      const temp = (value) => Math.round(fahrenheit ? value * 9 / 5 + 32 : value);
      $("location").textContent = [place.name, place.country].filter(Boolean).join(", ");
      $("temperature").textContent = temp(current.temperature_2m);
      $("condition").textContent = condition(current.weather_code);
      $("wind").textContent = Math.round(current.wind_speed_10m) + (fahrenheit ? " mph" : " km/h");
      $("humidity").textContent = Math.round(current.relative_humidity_2m) + "%";
      $("feels-like").textContent = temp(current.apparent_temperature) + "°";
      $("unit-label").textContent = (fahrenheit ? "°F" : "°C") + " · Daily";
      $("current-icon").innerHTML = icon(current.weather_code, true);
      $("forecast").innerHTML = daily.time.slice(0, 7).map((date, i) =>
        '<article class="day-card" aria-label="' + dayName(date, i) + ', ' + condition(daily.weather_code[i]) + ', high ' + temp(daily.temperature_2m_max[i]) + ', low ' + temp(daily.temperature_2m_min[i]) + '">' +
          '<div class="day-name">' + dayName(date, i) + '</div>' +
          '<div class="day-icon">' + icon(daily.weather_code[i]) + '</div>' +
          '<div class="temps"><span>' + temp(daily.temperature_2m_max[i]) + '°</span><span class="low">' + temp(daily.temperature_2m_min[i]) + '°</span></div>' +
        '</article>'
      ).join("");
    }
    function updateHeadline() {
      const hour = new Date().getHours();
      $("headline").textContent = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    }
    async function getPlace(query) {
      const exact = places[query.trim().toLowerCase()];
      if (exact) return exact;
      const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(query) + "&count=1&language=en&format=json";
      const response = await fetch(url);
      if (!response.ok) throw new Error("City search is temporarily unavailable.");
      const result = await response.json();
      const found = result.results && result.results[0];
      if (!found) throw new Error("We couldn't find that city. Try another name.");
      return { name: found.name, country: found.country, latitude: found.latitude, longitude: found.longitude, timezone: found.timezone || "auto" };
    }
    async function getWeather(place) {
      const params = new URLSearchParams({
        latitude: place.latitude, longitude: place.longitude, timezone: place.timezone || "auto",
        forecast_days: 7,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min"
      });
      const response = await fetch("https://api.open-meteo.com/v1/forecast?" + params);
      if (!response.ok) throw new Error("Weather service is temporarily unavailable.");
      const data = await response.json();
      if (!data.current || !data.daily || !data.daily.time || data.daily.time.length < 7) throw new Error("Weather data is incomplete.");
      return data;
    }
    async function search(query) {
      const status = $("status");
      const liveLabel = $("live-label");
      status.classList.remove("error");
      status.textContent = "Finding " + query + "…";
      liveLabel.textContent = "Updating";
      $("city-search").disabled = true;
      try {
        const place = await getPlace(query);
        const data = await getWeather(place);
        render(data, place, data.current_units?.temperature_2m === "°F" ? "fahrenheit" : "celsius");
        status.textContent = "Updated just now · Data by Open-Meteo";
        liveLabel.textContent = "Live forecast";
      } catch (error) {
        if (places[query.trim().toLowerCase()] || query.trim().toLowerCase() === "tokyo") {
          render(fallback, places.tokyo);
          status.textContent = "Live data unavailable · Showing a sample forecast";
          liveLabel.textContent = "Sample forecast";
        } else {
          status.textContent = error.message || "Couldn't load the forecast. Please try again.";
          status.classList.add("error");
          liveLabel.textContent = "Try again";
        }
      } finally {
        $("city-search").disabled = false;
        $("city-search").focus();
      }
    }
    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = $("city-search").value.trim();
      if (query) search(query);
    });
    $("city-search").addEventListener("input", () => { $("clear-search").hidden = !$("city-search").value; });
    $("clear-search").addEventListener("click", () => {
      $("city-search").value = "";
      $("clear-search").hidden = true;
      $("city-search").focus();
    });
    updateHeadline();
    render(fallback, places.tokyo);
    search("Tokyo");
  </script>
</body>
</html>
